name: Deploy

# Production deploys happen only when a GitHub Release is published, never on a
# push to main. Vercel's own git integration is disabled for main in
# vercel.json, so this workflow is the single path to production.
on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vercel:
    name: Deploy to Vercel
    # Pre-releases (e.g. v1.0.0-rc1) also fire "published"; skip them.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Checks out the commit the release tag points at, so the deployed build
      # is exactly the released code.
      - name: Checkout released commit
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
